name: Validate Mover Monitor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify test runtimes
        run: |
          python3 --version
          php --version
          node --version
          bash --version
      - name: Check package, checksums and isolated installation
        run: python3 tools/check.py
      - name: Protection, age selection, native invocation and authenticated UI tests
        run: python3 -m unittest discover -s tools -p '*_test.py'
      - name: Check all three interfaces and settings guards
        run: python3 tools/app_test.py
      - name: Check mode, pool and configuration recovery guards
        run: python3 tools/mode_test.py
      - name: Check pause race and dashboard refresh states
        run: |
          node tools/refresh_test.js
          node tools/queue_ui_test.js
          node tools/theme_ui_test.js
          node tools/depth_nav_test.js
          node tools/footer_controls_test.js
          node tools/queue_sort_test.js
          node tools/selective_refresh_test.js
      - name: Require stale generated artifacts to fail
        run: python3 tools/check_test.py
      - name: Require validation to leave tracked files unchanged
        run: git diff --exit-code

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: isolated-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: fejes-mover-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the tested manifest and source assets once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("fejes.mover.monitor.plg").getroot().get("version", ""))')"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
          tag="v$version"
          archive="fejes-mover-monitor-$version.zip"
          release_sums="RELEASE-SHA256SUMS"
          if gh release view "$tag" --json isDraft,targetCommitish --jq '.isDraft' > release-draft-state.txt 2>/dev/null; then
            if [ "$(cat release-draft-state.txt)" = 'false' ]; then
              echo "Release $tag is already published; nothing will be overwritten."
              exit 0
            fi
            target="$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo "Draft $tag targets $target, expected $GITHUB_SHA." >&2
              exit 1
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Fejes Mover Monitor $version" --notes "Validated Unraid 7.x release. See the repository README and dated acceptance evidence."
          fi
          git archive --format=zip --output="$archive" HEAD
          sha256sum fejes.mover.monitor.plg SHA256SUMS "$archive" > "$release_sums"
          for asset in fejes.mover.monitor.plg SHA256SUMS "$archive" "$release_sums"; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
              echo "Asset already uploaded: $asset"
            else
              gh release upload "$tag" "$asset"
            fi
          done
          gh release edit "$tag" --draft=false --prerelease=false
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName
