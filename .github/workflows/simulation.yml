name: Isolated Mover simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PHP CLI for real page fixtures and package checks
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Run Python, PHP application and JavaScript checks
        run: python3 -m unittest discover -s tools -p '*_test.py'
      - name: Verify reproducible package and isolated install/update/remove
        run: python3 tools/check.py
      - name: Run real guard and launcher with synthetic boundaries
        run: python3 tools/simulate.py --output simulation-report
      - name: Check demo translations and decisions
        run: node tools/demo_test.cjs
      - name: Save reviewable HTML and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fejes-mover-simulation
          path: simulation-report/
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/fejes-browser" playwright@1.51.1
          node "$RUNNER_TEMP/fejes-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise demo and capture desktop/mobile previews
        env:
          NODE_PATH: ${{ runner.temp }}/fejes-browser/node_modules
        run: node tools/demo_browser_test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fejes-mover-interface-preview
          path: demo-screenshots/
