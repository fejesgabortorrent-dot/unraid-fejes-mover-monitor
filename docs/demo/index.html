function render(){const t=translations[lang],selected=$('scenario').selectedIndex<0?0:$('scenario').selectedIndex;document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);$('language').value=lang;$('scenario').replaceChildren(...t.scenarios.map((name,i)=>{const o=document.createElement('option');o.value=i;o.textContent=name;return o}));$('scenario').selectedIndex=selected;update();renderHistory()}
function update(){const s=states[Number($('scenario').value)],threshold=Number($('threshold').value),t=translations[lang];const usage=Math.round((1-s.free/931.5)*100);$('ring').style.setProperty('--usage',usage);$('used').textContent=usage+'%';$('free').textContent=s.free+' GiB';$('threshold-value').textContent=threshold+' GiB';$('rule-threshold').textContent=threshold+' GiB';$('guards').replaceChildren(...['torrent','backup','parity','cooldown'].map(key=>{const status=s[key]||'clear',row=document.createElement('div');row.className='statusrow'+(status==='clear'?'':' blocked');const icon=document.createElement('span');icon.className='check';icon.setAttribute('aria-hidden','true');icon.textContent=status==='clear'?'✓':'Ⅱ';const label=document.createElement('span');label.textContent=t[key];const value=document.createElement('small');value.textContent=t[status];row.append(icon,label,value);return row}));const [d,r]=decision(s,threshold);$('decision').textContent=t[d];$('reason').textContent=t[r];$('dash-usage').textContent=usage+'%';$('dash-free').textContent=t.free+': '+s.free+' GiB';$('dash-bar').style.width=usage+'%';$('dash-decision').textContent=t[d];$('dash-reason').textContent=t[r]}
$('language').addEventListener('change',()=>{lang=$('language').value;try{localStorage.setItem('fejes-demo-language',lang)}catch(_){}render()});$('theme').addEventListener('click',()=>{document.body.classList.toggle('light');try{localStorage.setItem('fejes-demo-theme',document.body.classList.contains('light')?'light':'dark')}catch(_){}});$('scenario').addEventListener('change',update);$('threshold').addEventListener('input',()=>{$('threshold-number').value=$('threshold').value;update()});$('threshold-number').addEventListener('change',()=>{const value=Number($('threshold-number').value);$('threshold').value=Number.isFinite(value)?Math.max(50,Math.min(850,Math.round(value/10)*10)):300;$('threshold-number').value=$('threshold').value;update()});$('run').addEventListener('click',()=>{update();const scenario=Number($('scenario').value),threshold=Number($('threshold').value);history.unshift({time:new Date(),scenario,threshold,result:decision(states[scenario],threshold)[0]});history=history.slice(0,50);renderHistory();$('run').animate([{opacity:.5},{opacity:1}],{duration:300})});document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>{const active=b===button;b.setAttribute('aria-selected',String(active));$(b.dataset.tab).classList.toggle('hidden',!active)})}));$('dash-open').addEventListener('click',()=>$('tab-overview').click());render();
</script></body></html>
